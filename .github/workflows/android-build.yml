name: Build Android (APK + Play Store AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_OFFLINE: 1

      - name: Build release APK and AAB (signed when the key secrets are set)
        working-directory: android
        env:
          KS_B64: ${{ secrets.PS_KEYSTORE_BASE64 }}
          PS_KEYSTORE_PASSWORD: ${{ secrets.PS_KEYSTORE_PASSWORD }}
          PS_KEY_ALIAS: ${{ secrets.PS_KEY_ALIAS }}
          PS_KEY_PASSWORD: ${{ secrets.PS_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            export PS_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
            echo "Signing with the Pak Shutter upload key"
          else
            echo "::warning::No signing key secrets set - building with the debug key (fine for testing, not for Play Store)"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PakShutter.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/PakShutter-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: pakshutter-android
          path: out/
          retention-days: 30
