name: Build Android (APK + Play Store AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_OFFLINE: 1

      - name: Build release APK and AAB (signed when the key secrets are set)
        working-directory: android
        env:
          KS_B64: ${{ secrets.PS_KEYSTORE_BASE64 }}
          PS_KEYSTORE_PASSWORD: ${{ secrets.PS_KEYSTORE_PASSWORD }}
          PS_KEY_ALIAS: ${{ secrets.PS_KEY_ALIAS }}
          PS_KEY_PASSWORD: ${{ secrets.PS_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            export PS_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
            echo "Signing with the Pak Shutter upload key"
          else
            echo "::warning::No signing key secrets set - building with the debug key (fine for testing, not for Play Store)"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PakShutter.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/PakShutter-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: pakshutter-android
          path: out/
          retention-days: 30

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pak Shutter build ${{ github.run_number }}
          body: |
            PakShutter.apk - install directly on Android phones.
            PakShutter-PlayStore.aab - upload to Google Play Console.
          files: |
            out/PakShutter.apk
            out/PakShutter-PlayStore.aab

      - name: Store latest build on the builds branch
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add PakShutter.apk PakShutter-PlayStore.aab
          git commit -q -m "Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
